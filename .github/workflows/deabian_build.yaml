name: Build Isar for Linux (Debian Bookworm)

on:
  workflow_dispatch:

jobs:
  build_linux:
    name: Build Linux Binary (glibc 2.36)
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim

    steps:
      - name: Show glibc version
        run: |
          ldd --version | head -n 1
          
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y curl git xz-utils bash clang cmake pkg-config \
                             libgtk-3-dev liblzma-dev libssl-dev \
                             python3 ca-certificates build-essential

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | bash -s -- -y
          . "$HOME/.cargo/env"
          rustc --version
          cargo --version

      - name: Build Linux binary using Isar's official script
        run: |
          . "$HOME/.cargo/env"
          echo "Running tool/build_linux.sh x64 ..."
          bash tool/build_linux.sh x64

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: libisar_linux_x64.so
          path: libisar_linux_x64.so
          retention-days: 7
